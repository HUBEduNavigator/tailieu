name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Thiết lập GitHub Pages
        uses: actions/configure-pages@v6
        continue-on-error: true
        with:
          enablement: true
      - run: npm ci
      - name: Kiểm tra kiểu dữ liệu và tính toàn vẹn nội dung
        run: |
          npm run typecheck
          npm run validate
      - name: Build tĩnh (basePath /tailieu)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /tailieu
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
